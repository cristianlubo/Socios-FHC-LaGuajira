*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
header,.bar,main{max-width:1280px;margin:auto;padding-left:20px;padding-right:20px}
header{padding-top:20px}h1{margin:0;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut);max-width:75ch}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

#count{font-size:13px;color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding-top:10px;padding-bottom:28px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.map{background:var(--sea);border-radius:14px;overflow:hidden;position:relative}
svg{width:100%;height:auto;display:block}
.nei{fill:var(--nei)}.lbl{font-size:30px;font-style:italic;fill:var(--mut)}
.mu{cursor:pointer;outline:none}
.mu path{fill:color-mix(in srgb,var(--r1) calc(var(--t)*100%),var(--r0));stroke:var(--panel);stroke-width:5;stroke-linejoin:round;transition:fill .2s}
.mu.e path{fill:var(--empty);stroke:var(--mut);stroke-width:3;stroke-dasharray:10 8}
.mu.off path{fill:var(--empty)}
.mu:hover path,.mu:focus-visible path{stroke:var(--ink);stroke-width:8}
.mu.sel path{stroke:var(--ink);stroke-width:12}
.mu text{font-size:30px;font-weight:600;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:7px;stroke-linejoin:round}
.mu.e text{fill:var(--mut);font-weight:400}.mu .n{font-size:46px;font-weight:800;stroke-width:9px}

.leg div{display:flex;justify-content:space-between}

a{color:var(--acc)}

.org li.f{grid-template-columns:1fr}
